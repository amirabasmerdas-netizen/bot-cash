services:
  - type: web
    name: telegram-bot-analyzer
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        value: "7667947505:AAHoaSzSEeB6okKIpuwitnID4SEmbko71d0"
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: telegram-bot-analyzer
          property: url
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8443
